<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>MANOA | Website Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      background: #1c1917;
      color: #f4f0e9;
      font-family: Inter, sans-serif;
    }
    .banner {
      width: min(720px, 100%);
      border: 1px solid rgba(244, 240, 233, 0.25);
      padding: 3rem 2rem;
      text-align: center;
    }
    .banner__label {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 500;
      color: #c4a574;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 400;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      line-height: 1.1;
      margin-bottom: 1.5rem;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: rgba(244, 240, 233, 0.88);
      margin-bottom: 1rem;
    }
    p:last-child { margin-bottom: 0; }
    .banner__line {
      width: 48px;
      height: 1px;
      background: #c4a574;
      margin: 1.75rem auto;
    }
  </style>
</head>
<body>
  <main class="banner" role="status">
    <p class="banner__label">Website offline</p>
    <h1>This site is down.</h1>
    <div class="banner__line"></div>
    <p>Learn business first. Then ask people to build something for you.</p>
    <p>Pay the money for the work people already did. Not a single rupee has been paid for this website.</p>
  </main>
</body>
</html>
